<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Klara Kapprell – Kommunikationsdesignerin mit Fokus auf spielerisches Grafikdesign und Bildungsmedien.">
  <title>Klara Kapprell</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/marquee.css">
  <style>
    .pixel-field       { background: none; }
    #pixel-field-back  { z-index: 0; }
    #pixel-field-front { z-index: 4; }

    .wordmark__letter { position: relative; }

    footer.has-marquee { cursor: none; }
  </style>
  <link rel="icon" type="image/png" href="media/favicon.png">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Klara Kapprell",
      "url": "https://klarakapprell.de",
      "sameAs": "https://www.instagram.com/klara.kapprell",
      "description": "Kommunikationsdesignerin mit Fokus auf spielerisches Grafikdesign und Bildungsmedien.",
      "image": "https://klarakapprell.de/media/favicon.png"
    }
  </script>
</head>
<body>

  <div class="pixel-field" id="pixel-field-back"></div>
  <div class="pixel-field" id="pixel-field-front"></div>

  <header>
    <a href="index.html" class="nav-logo" id="nav-logo">Klara Kapprell</a>
    <div class="menu">
      <nav class="nav" id="nav">
        <ul>
          <li>
            <a href="works.html">Works</a>
          </li>
          <li>
            <a href="about.html">About</a>
          </li>
          <li>
            <a href="imprint.html">Imprint</a>
          </li>
          <li>
            <a href="mailto:hallo@klarakapprell.de" class="mail" id="mail">Say Hi!</a>
          </li>
        </ul>
      </nav>
      <button type="button" class="lang-toggle" id="lang-toggle" data-target="en" aria-label="Switch to English">EN</button>
      <div class="nav-toggle" id="nav-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <main class="hero" id="hero">

    <h1 class="wordmark" id="wordmark" aria-label="Klara Kapprell">
      <span class="wordmark__line" data-word="Klara" data-alt="4"></span>
      <span class="wordmark__line" data-word="Kapprell" data-alt="0,6,7"></span>
    </h1>

  </main>

  <footer class="has-marquee">
    <div class="marquee">
      <div class="marquee__track">
        <span class="marquee__text">🪄 +
          <svg class="marquee__sprite" viewBox="0 0 3 3" aria-hidden="true" focusable="false">
            <rect class="fill-green" x="1" y="0" width="1" height="1"/>
            <rect class="fill-green" x="0" y="1" width="1" height="1"/>
            <rect class="fill-pink"  x="1" y="1" width="1" height="1"/>
            <rect class="fill-green" x="2" y="1" width="1" height="1"/>
            <rect class="fill-green"  x="1" y="2" width="1" height="1"/>
          </svg>
          = 🌱 ✦ do a little pixel magic ✦</span>
      </div>
    </div>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/index.js"></script>
  <script src="js/marquee.js"></script>
  <script>
    (() => {
      const LAYERS = [-1, 2, 5];
      const assignLayers = () => {
        const letterEls = document.querySelectorAll('.wordmark__letter');
        if (!letterEls.length) return false;
        letterEls.forEach((b) => {
          b.style.zIndex = LAYERS[Math.floor(Math.random() * LAYERS.length)];
        });
        return true;
      };
      let tries = 0;
      const waitForLetters = () => {
        if (assignLayers() || ++tries > 120) return;
        requestAnimationFrame(waitForLetters);
      };
      requestAnimationFrame(waitForLetters);
    })();
  </script>

</body>
</html>
