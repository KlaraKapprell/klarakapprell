<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Klara Kapprell – Kommunikationsdesignerin mit Fokus auf spielerisches Grafikdesign und Bildungsmedien.">
  <title>Klara Kapprell</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/start-leben.css">
  <style>
    /* Nur auf dieser Seite. Zwei Rankenfelder mit dem Namen dazwischen -
       jede Ranke wuerfelt aus, in welchem sie waechst. Keine eigene
       Flaeche, sonst deckte die weisse Fuellung den Namen zu.
       In css/start-leben.css bleibt alles, damit der eigenstaendige
       Entwurf start-leben.html unveraendert bleibt. */
    .leben-feld { background: none; }
    #leben-hinten { z-index: 0; }
    #leben-vorn   { z-index: 4; }

    /* Der Name darf keinen eigenen Stapelkontext aufmachen, sonst waeren
       die Buchstaben darin gefangen und koennten sich nicht zwischen die
       Ebenen schieben. transform faellt deshalb weg - die Mitte trifft
       margin-top genauso: zwei Zeilen mal 0.82 Zeilenhoehe, halb davon. */
    .typo-name {
      transform: none;
      margin-top: -0.82em;
      z-index: auto;
    }

    /* Jeder Buchstabe bekommt per Skript eine der drei Lagen */
    .typo-letter { position: relative; }
  </style>
  <link rel="icon" type="image/png" href="media/favicon.png">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Klara Kapprell",
      "url": "https://klarakapprell.de",
      "sameAs": "https://www.instagram.com/klara.kapprell",
      "description": "Kommunikationsdesignerin mit Fokus auf spielerisches Grafikdesign und Bildungsmedien.",
      "image": "https://klarakapprell.de/media/favicon.png"
    }
  </script>
</head>
<body>

  <!-- Die beiden Rankenebenen. Der Name liegt dazwischen. -->
  <div class="leben-feld" id="leben-hinten"></div>
  <div class="leben-feld" id="leben-vorn"></div>

  <header>
    <a href="index.html" class="nav-logo" id="nav-logo">Klara Kapprell</a>
    <div class="menu">
      <nav class="nav" id="nav">
        <ul>
          <li>
            <a href="works.html">Works</a>
          </li>
          <li>
            <a href="about.html">About</a>
          </li>
          <li>
            <a href="imprint.html">Imprint</a>
          </li>
          <li>
            <a href="mailto:hallo@klarakapprell.de" class="mail" id="mail">Say Hi!</a>
          </li>
        </ul>
      </nav>
      <button type="button" class="lang-toggle" id="lang-toggle" data-target="en" aria-label="Switch to English">EN</button>
      <div class="nav-toggle" id="nav-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <main class="start-stage" id="start-stage">

    <h1 class="typo-name" id="typo-name" aria-label="Klara Kapprell">
      <span class="typo-line" data-word="Klara"></span>
      <span class="typo-line" data-word="Kapprell"></span>
    </h1>

  </main>

  <footer>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/start.js"></script>
  <script src="js/start-leben.js"></script>
  <script>
    // Jeder Buchstabe bekommt zufaellig eine Lage: ganz hinten, zwischen
    // den beiden Rankenebenen, oder ganz vorn. Dadurch laeuft dieselbe
    // Ranke am einen Buchstaben vorbei und hinter dem naechsten durch.
    // start.js baut die Buchstaben erst auf, deshalb warten wir darauf.
    (() => {
      const LAGEN = [-1, 2, 5];   // hinter beiden / dazwischen / vor beiden
      const verteilen = () => {
        const buchstaben = document.querySelectorAll('.typo-letter');
        if (!buchstaben.length) return false;
        buchstaben.forEach((b) => {
          b.style.zIndex = LAGEN[Math.floor(Math.random() * LAGEN.length)];
        });
        return true;
      };
      let versuche = 0;
      const warten = () => {
        if (verteilen() || ++versuche > 120) return;
        requestAnimationFrame(warten);
      };
      requestAnimationFrame(warten);
    })();
  </script>

</body>
